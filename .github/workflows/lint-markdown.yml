name: Validate Playbook Frontmatter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml requests

      - name: Run Schema Validation
        run: python scripts/validate_frontmatter.py

      - name: Check Dead Links
        run: python scripts/check_dead_links.py
